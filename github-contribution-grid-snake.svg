<svg viewBox="-16 -32 880 192" width="880" height="192" xmlns="http://www.w3.org/2000/svg">
  <desc>Aesthetic Snake Animation - Visualizing GitHub Contributions</desc>
  <defs>
    <style>
      :root {
        --cb: #1b1f230a;
        --cs: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --ce: #ebedf0;
      }
      
      svg {
        background: #0d1117;
      }
      
      rect.tile {
        fill: var(--ce);
        stroke: #30363d;
        stroke-width: 1;
        opacity: 0.2;
      }
      
      rect.snake {
        fill: url(#snakeGradient);
        stroke: #f97316;
        stroke-width: 1.5;
        filter: drop-shadow(0 0 2px rgba(249, 115, 22, 0.6));
        animation: snakeGlow 3s ease-in-out infinite;
      }
      
      @keyframes snakeGlow {
        0%, 100% {
          filter: drop-shadow(0 0 2px rgba(249, 115, 22, 0.6));
          opacity: 0.9;
        }
        50% {
          filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.8));
          opacity: 1;
        }
      }
      
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      
      .snake-segment {
        animation: slideIn 0.5s ease-out forwards;
      }
      
      .snake-segment:nth-child(1) { animation-delay: 0s; }
      .snake-segment:nth-child(2) { animation-delay: 0.05s; }
      .snake-segment:nth-child(3) { animation-delay: 0.1s; }
      .snake-segment:nth-child(4) { animation-delay: 0.15s; }
      .snake-segment:nth-child(5) { animation-delay: 0.2s; }
      .snake-segment:nth-child(6) { animation-delay: 0.25s; }
      .snake-segment:nth-child(7) { animation-delay: 0.3s; }
      .snake-segment:nth-child(8) { animation-delay: 0.35s; }
    </style>
    
    <linearGradient id="snakeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffa500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd93d;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadowFilter">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background grid tiles -->
  <g id="background">
    <rect class="tile" x="0" y="0" width="13" height="13"/>
    <rect class="tile" x="16" y="0" width="13" height="13"/>
    <rect class="tile" x="32" y="0" width="13" height="13"/>
    <rect class="tile" x="48" y="0" width="13" height="13"/>
    <rect class="tile" x="64" y="0" width="13" height="13"/>
    <rect class="tile" x="80" y="0" width="13" height="13"/>
    <rect class="tile" x="96" y="0" width="13" height="13"/>
    <rect class="tile" x="112" y="0" width="13" height="13"/>
    <rect class="tile" x="128" y="0" width="13" height="13"/>
    <rect class="tile" x="144" y="0" width="13" height="13"/>
  </g>
  
  <!-- Snake animation segments -->
  <g id="snake" filter="url(#shadowFilter)">
    <!-- Head -->
    <rect class="snake snake-segment" x="0" y="0" width="13" height="13" rx="2"/>
    <!-- Body segments -->
    <rect class="snake snake-segment" x="16" y="0" width="13" height="13" rx="2"/>
    <rect class="snake snake-segment" x="32" y="0" width="13" height="13" rx="2"/>
    <rect class="snake snake-segment" x="48" y="0" width="13" height="13" rx="2"/>
    <rect class="snake snake-segment" x="64" y="0" width="13" height="13" rx="2"/>
    <rect class="snake snake-segment" x="80" y="0" width="13" height="13" rx="2"/>
    <rect class="snake snake-segment" x="96" y="0" width="13" height="13" rx="2"/>
    <rect class="snake snake-segment" x="112" y="0" width="13" height="13" rx="2"/>
  </g>
  
  <!-- Optional: Decorative contribution count -->
  <text x="440" y="95" font-family="Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle" opacity="0.6">
    🐍 Contributing Contributions
  </text>
</svg>
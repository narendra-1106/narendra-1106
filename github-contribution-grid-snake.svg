<svg viewBox="0 0 900 200" width="900" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root {
        --color-bg: #0d1117;
        --color-grid: #30363d;
        --color-snake: #ff1744;
        --color-text: #8b949e;
      }

      svg {
        background: var(--color-bg);
      }

      /* Background grid */
      rect.tile {
        fill: #1c2128;
        stroke: var(--color-grid);
        stroke-width: 1;
        opacity: 0.3;
      }

      /* Snake segments */
      rect.snake {
        fill: url(#gradient-snake);
        stroke: #ff1744;
        stroke-width: 2;
        filter: drop-shadow(0 0 4px #ff1744);
        animation: pulse-glow 2s ease-in-out infinite;
      }

      @keyframes pulse-glow {
        0%, 100% {
          filter: drop-shadow(0 0 4px rgba(255, 23, 68, 0.6));
          opacity: 0.9;
        }
        50% {
          filter: drop-shadow(0 0 12px rgba(255, 23, 68, 1));
          opacity: 1;
        }
      }

      @keyframes move-right {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(800px);
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .snake-head {
        animation: move-right 8s linear infinite;
      }

      .snake-body-1 {
        animation: move-right 8s linear infinite;
        animation-delay: -0.5s;
      }

      .snake-body-2 {
        animation: move-right 8s linear infinite;
        animation-delay: -1s;
      }

      .snake-body-3 {
        animation: move-right 8s linear infinite;
        animation-delay: -1.5s;
      }

      .snake-body-4 {
        animation: move-right 8s linear infinite;
        animation-delay: -2s;
      }

      /* Text styling */
      text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        fill: var(--color-text);
      }

      .title {
        font-size: 18px;
        font-weight: bold;
        fill: #c9d1d9;
      }
    </style>

    <!-- Gradient for snake -->
    <linearGradient id="gradient-snake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1744;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff5252;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9100;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background grid -->
  <g id="grid">
    <rect class="tile" x="10" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="28" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="46" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="64" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="82" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="100" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="118" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="136" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="154" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="172" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="190" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="208" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="226" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="244" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="262" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="280" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="298" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="316" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="334" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="352" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="370" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="388" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="406" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="424" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="442" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="460" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="478" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="496" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="514" y="50" width="14" height="14" rx="2"/>
    <rect class="tile" x="532" y="50" width="14" height="14" rx="2"/>
  </g>

  <!-- Snake moving across screen -->
  <g id="snake" filter="url(#glow)">
    <!-- Head -->
    <rect class="snake snake-head" x="10" y="50" width="14" height="14" rx="2"/>
    <!-- Body segments -->
    <rect class="snake snake-body-1" x="10" y="50" width="14" height="14" rx="2"/>
    <rect class="snake snake-body-2" x="10" y="50" width="14" height="14" rx="2"/>
    <rect class="snake snake-body-3" x="10" y="50" width="14" height="14" rx="2"/>
    <rect class="snake snake-body-4" x="10" y="50" width="14" height="14" rx="2"/>
  </g>

  <!-- Title -->
  <text class="title" x="450" y="30" text-anchor="middle">🐍 GitHub Contribution Snake Animation</text>
  
  <!-- Footer -->
  <text x="450" y="175" text-anchor="middle" font-size="12" opacity="0.7">
    Watch the snake consume contributions! 
  </text>
</svg>